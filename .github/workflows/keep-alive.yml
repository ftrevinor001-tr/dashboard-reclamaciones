name: Mantener app despierta

# Corre cada 5 minutos para hacer un ping a la app usando el endpoint
# especial ?ping=1 que responde de inmediato sin cargar toda la lógica.
# Esto evita que Streamlit Cloud duerma la app.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la app de Streamlit
        run: |
          echo "Haciendo ping a la app usando endpoint ?ping=1..."
          RESPONSE=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 KeepAlive" \
            --max-time 60 \
            "https://dashboard-reclamaciones.streamlit.app/?ping=1")
          echo "Código HTTP: $RESPONSE"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "303" ]; then
            echo "Advertencia: la app respondió con código $RESPONSE"
          fi
          echo "Ping completado a las $(date -u)"
